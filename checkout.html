<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finalizar compra · Cardian Muebles</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .co{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr);gap:32px;align-items:start;padding-block:24px 48px}
  @media (max-width:860px){
    .co{display:flex;flex-direction:column;gap:14px}
    .co > section{display:contents}
    .co h1{order:1;margin-bottom:0}.co .stepper{order:2;margin-bottom:0}.co .summary{order:3;position:static;padding:0;overflow:hidden;align-self:stretch;width:100%}.co #panel{order:4}
    .co .summary .sum-toggle{display:flex}
    .co .summary .sum-body{display:none;padding:0 16px 16px}
    .co .summary.open .sum-body{display:block}
    .summary .sum-body h2{display:none}
  }
  .sum-toggle{display:none;width:100%;align-items:center;gap:10px;padding:14px 16px;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
  .sum-toggle span{flex:1;font-size:14px}
  .sum-toggle span small{display:block;color:var(--gold-deep);font-size:12px;margin-top:2px}
  .sum-toggle b{font-size:17px;font-weight:600}
  .stepper span{white-space:nowrap}
  @media (max-width:560px){.stepper span{font-size:10px;padding:5px 10px}}
  h1{font-size:clamp(26px,3.5vw,34px)}
  .stepper{display:flex;gap:6px;margin:14px 0 24px;flex-wrap:wrap}
  .stepper span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface)}
  .stepper span.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .stepper span.done{border-color:var(--gold);color:var(--gold-deep)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;animation:rise .45s both}
  .panel h2{font-size:19px;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:560px){.grid2{grid-template-columns:1fr}}
  .grid2 .full{grid-column:1/-1}
  .opts{display:grid;gap:10px}
  .opt{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:14px;background:var(--surface);text-align:left;width:100%;transition:border-color .2s,box-shadow .2s,background .2s,transform .2s}
  .opt:hover{border-color:var(--gold);transform:translateX(3px)}
  .opt[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);background:var(--gold-soft)}
  .opt .radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center}
  .opt[aria-pressed="true"] .radio{border-color:var(--gold-deep)}
  .opt[aria-pressed="true"] .radio::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold-deep)}
  .opt .t{font-weight:500;font-size:14px}.opt .d{font-size:12.5px;color:var(--muted)}
  .opt .b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep);font-weight:500;white-space:nowrap}
  .mp{display:inline-block;background:#009ee3;color:#fff;font-size:10px;font-weight:600;letter-spacing:.04em;padding:2px 6px;border-radius:3px;vertical-align:1px}
  .actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
  .summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:sticky;top:96px}
  .summary h2{font-size:17px;margin-bottom:10px}
  .summary .it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .summary .it img{width:54px;height:40px;object-fit:cover;border-radius:3px}
  .summary .it b{font-weight:500;display:block}
  .summary .it small{color:var(--muted)}
  .summary .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px}
  .summary .row small{display:block;color:var(--muted);font-size:12px}
  .summary .disc{color:var(--ok)}
  .summary .total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:18px;font-weight:600}
  .instr{border:1px solid var(--line);border-radius:6px;padding:16px;background:var(--surface-2);font-size:14px;margin-top:14px}
  .instr h3{font-size:16px;margin-bottom:8px}
  .instr dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0;font-size:13px}
  .instr dt{color:var(--muted)}.instr dd{margin:0;font-weight:500}
  .instr ol{margin:10px 0 0;padding-left:18px}.instr li{margin-bottom:4px}
  .mpbtn{display:block;width:100%;background:#009ee3;color:#fff;border:0;border-radius:6px;padding:14px;font-weight:600;letter-spacing:.04em;margin-top:14px;font-size:14px}
  .review dl{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;font-size:14px;margin:0}
  .review dt{color:var(--muted)}.review dd{margin:0}
  .review .edit{font-size:12px;color:var(--gold-deep);margin-left:8px}
  .secure{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:12px}
  .secure svg{width:16px;height:16px;color:var(--ok)}
  label.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:14px}
  label.chk input{accent-color:var(--gold-deep);margin-top:3px}
  @media (max-width:560px){
    .opt{grid-template-columns:22px 1fr;row-gap:6px}
    .opt .b{grid-column:2;justify-self:start;white-space:normal}
    .actions{flex-direction:column-reverse}
    .actions .btn{width:100%;justify-content:center}
    .review dl{grid-template-columns:1fr;gap:2px 0}
    .review dt{margin-top:10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  }
</style>
</head>
<body>
<div id="site-header"></div>

<main class="wrap">
  <nav class="crumbs" aria-label="Ruta"><a href="/">Inicio</a><span>/</span><a href="/carrito">Carrito</a><span>/</span>Finalizar compra</nav>
  <div class="co">
    <section>
      <h1>Finalizar compra</h1>
      <div class="stepper" id="stepper"></div>
      <div id="panel"></div>
    </section>
    <aside class="summary" id="summary"></aside>
  </div>
</main>

<div id="site-footer"></div>
<script src="/assets/data.js"></script>
<script src="/assets/site.js"></script>
<script>
(function(){
  const C = window.Cardian, D = window.CARDIAN, { $, $$, fmt, fmt2 } = C;
  const lines = C.cartLines();
  if (!lines.length) { location.replace('/carrito'); return; }
  const o = Object.assign({ step: 1, delivery: 'ship', state: 'Ciudad de México', pay: 'mp', name: '', phone: '', email: '', street: '', colonia: '', cp: '', city: '', floor: 'pb', notes: '', invoice: false, rfc: '', razon: '' }, C.getOrder());
  if (o.step > 3) o.step = 1;
  o.pay = 'mp'; o.step = 1; // única forma de pago en línea, un solo paso
  const save = () => C.setOrder(o);
  const calc = () => {
    const sub = lines.reduce((s, l) => s + l.unit * l.qty, 0);
    const ship = o.delivery === 'store' ? { cost: 0, zone: null } : C.shipping(o.state, lines.map(l => ({ factor: l.p.factor, qty: l.qty })));
    const disc = o.pay === 'spei' ? Math.round(sub * 0.05) : 0;
    const base = sub + ship.cost - disc;
    const iva = o.invoice ? Math.round(base * 0.16) : 0; // con factura se agrega el IVA
    return { sub, ship, disc, iva, total: base + iva };
  };
  function summary() {
    const c = calc();
    const nArt = lines.reduce((s, l) => s + l.qty, 0);
    $('#summary').innerHTML = `<button type="button" class="sum-toggle" id="sumToggle" aria-expanded="${$('#summary').classList.contains('open')}"><span>Tu pedido · ${nArt} artículo${nArt === 1 ? '' : 's'}<small>${$('#summary').classList.contains('open') ? 'Ocultar detalle ▴' : 'Ver detalle ▾'}</small></span><b class="num">${fmt(c.total)}</b></button><div class="sum-body"><h2>Tu pedido</h2>${lines.map(l => `<div class="it"><img src="/${l.p.imgs[0]}" alt=""><div style="flex:1"><b>${l.qty} × ${l.p.name}</b><small>${l.tapiz ? D.TAPIZ[l.tapiz].name : ''}${l.mech ? ' · ' + l.mech : ''}</small></div><span class="num">${fmt(l.unit * l.qty)}</span></div>`).join('')}
      <div class="row" style="margin-top:8px"><span>Subtotal</span><span class="num">${fmt(c.sub)}</span></div>
      <div class="row"><span>Envío<small>${o.delivery === 'store' ? 'Recoger en bodega' : o.state + ' · ' + c.ship.zone.days}</small></span><span class="num">${c.ship.cost ? fmt(c.ship.cost) : 'Gratis'}</span></div>
      ${c.iva ? `<div class="row"><span>IVA 16 %<small>Porque pediste factura</small></span><span class="num">${fmt(c.iva)}</span></div>` : ''}
      <div class="row total"><span>Total</span><span class="num">${fmt(c.total)}</span></div>
      <p class="note" style="margin-top:6px;font-size:12px;color:var(--muted)">${c.iva ? 'Total con IVA incluido.' : 'Precios sin IVA. Si necesitas factura, se agrega el 16 %.'}</p>
      <div class="secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Pago seguro con Mercado Pago. No guardamos datos de tarjeta.</div></div>`;
    $('#sumToggle').onclick = () => { $('#summary').classList.toggle('open'); summary(); };
  }
  function stepper() { $('#stepper').innerHTML = '<span class="on">1 Tus datos</span><span>2 Pagas en Mercado Pago</span>'; }
  const inp = (id, label, extra) => `<div class="field ${extra && extra.full ? 'full' : ''}"><label for="${id}">${label}</label><input class="input" id="${id}" value="${(o[id] || '').replace(/"/g, '&quot;')}" ${extra && extra.attrs || ''}><div class="err-msg" id="err-${id}" hidden></div></div>`;

  // Un solo paso: nombre, WhatsApp y dirección. El correo y los datos de la tarjeta los pide Mercado Pago al pagar.
  function paso() {
    $('#panel').innerHTML = `<div class="panel"><h2>Tus datos</h2>
      <div class="grid2">${inp('name', 'Nombre completo', { attrs: 'autocomplete="name" autocapitalize="words"' })}${inp('phone', 'WhatsApp (10 dígitos)', { attrs: 'type="tel" inputmode="numeric" autocomplete="tel"' })}</div>
      <h2 style="margin-top:24px">Entrega</h2>
      <div class="opts">
        <button type="button" class="opt" data-d="ship" aria-pressed="${o.delivery === 'ship'}"><span class="radio"></span><span><span class="t">Envío a domicilio</span><br><span class="d">Con armado y retiro del empaque</span></span><span class="b">Gratis en CDMX y EdoMex</span></button>
        <button type="button" class="opt" data-d="store" aria-pressed="${o.delivery === 'store'}"><span class="radio"></span><span><span class="t">Recoger en bodega</span><br><span class="d">Te confirmamos lugar y fecha por WhatsApp</span></span><span class="b">Sin costo</span></button>
      </div>
      <div id="addr" ${o.delivery === 'store' ? 'hidden' : ''} style="margin-top:16px"><div class="grid2">
        ${inp('cp', 'Código postal', { attrs: 'inputmode="numeric" autocomplete="postal-code" placeholder="5 dígitos"' })}
        <div class="field"><label for="state">Estado</label><select class="input" id="state">${D.states.map(s => `<option ${s === o.state ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        ${inp('street', 'Calle y número', { full: true, attrs: 'autocomplete="street-address"' })}${inp('colonia', 'Colonia', { attrs: 'autocomplete="address-level3"' })}${inp('city', 'Ciudad o municipio', { attrs: 'autocomplete="address-level2"' })}
      </div></div>
      <label class="chk"><input type="checkbox" id="invoice" ${o.invoice ? 'checked' : ''}> Necesito factura <span style="color:var(--gold-deep)">(se agrega IVA 16 %)</span></label>
      <div id="inv" ${o.invoice ? '' : 'hidden'} style="margin-top:10px"><div class="grid2">${inp('razon', 'Razón social o nombre')}${inp('rfc', 'RFC')}</div></div>
      <div class="callout" style="margin-top:18px;font-size:13px">Te llevamos a <b>Mercado Pago</b> para pagar con tarjeta (a meses con tarjetas participantes), OXXO o saldo. Al pagar aceptas los <a href="/terminos" style="color:var(--gold-deep)">términos de compra</a> y el <a href="/privacidad" style="color:var(--gold-deep)">aviso de privacidad</a>.</div>
      <div class="actions"><a class="btn ghost sm" href="/carrito">← Volver al carrito</a><button type="button" class="btn gold" id="confirm">Pagar con Mercado Pago</button></div></div>`;
    $$('.opt[data-d]').forEach(b => b.onclick = () => { o.delivery = b.dataset.d; $$('.opt[data-d]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); $('#addr').hidden = o.delivery === 'store'; save(); summary(); });
    $('#state').onchange = e => { o.state = e.target.value; save(); summary(); };
    // Con el código postal detectamos el estado (los dos primeros dígitos lo determinan en México).
    const ESTADO_CP = [[0, 16, 'Ciudad de México'], [20, 20, 'Aguascalientes'], [21, 22, 'Baja California'], [23, 23, 'Baja California Sur'], [24, 24, 'Campeche'], [25, 27, 'Coahuila'], [28, 28, 'Colima'], [29, 30, 'Chiapas'], [31, 33, 'Chihuahua'], [34, 35, 'Durango'], [36, 38, 'Guanajuato'], [39, 41, 'Guerrero'], [42, 43, 'Hidalgo'], [44, 49, 'Jalisco'], [50, 57, 'Estado de México'], [58, 61, 'Michoacán'], [62, 62, 'Morelos'], [63, 63, 'Nayarit'], [64, 67, 'Nuevo León'], [68, 71, 'Oaxaca'], [72, 75, 'Puebla'], [76, 76, 'Querétaro'], [77, 77, 'Quintana Roo'], [78, 79, 'San Luis Potosí'], [80, 82, 'Sinaloa'], [83, 85, 'Sonora'], [86, 86, 'Tabasco'], [87, 89, 'Tamaulipas'], [90, 90, 'Tlaxcala'], [91, 96, 'Veracruz'], [97, 97, 'Yucatán'], [98, 99, 'Zacatecas']];
    $('#cp').addEventListener('input', e => {
      const v = e.target.value.replace(/\D/g, '').slice(0, 5); e.target.value = v;
      if (v.length !== 5) return;
      const n = +v.slice(0, 2); const m = ESTADO_CP.find(([a, b]) => n >= a && n <= b);
      if (m && D.states.includes(m[2]) && o.state !== m[2]) { o.state = m[2]; $('#state').value = m[2]; save(); summary(); C.toast('Estado: ' + m[2]); }
    });
    $('#phone').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10); });
    $('#invoice').onchange = e => { o.invoice = e.target.checked; $('#inv').hidden = !o.invoice; save(); summary(); };
    $('#confirm').onclick = async () => {
      ['name', 'phone', 'street', 'colonia', 'cp', 'city', 'razon', 'rfc'].forEach(k => { const el = $('#' + k); if (el) o[k] = el.value.trim(); });
      let ok = true; const bad = (k, m) => { const el = $('#' + k); el.classList.add('err'); $('#err-' + k).textContent = m; $('#err-' + k).hidden = false; if (ok) el.focus(); ok = false; };
      $$('.input').forEach(e => e.classList.remove('err')); $$('.err-msg').forEach(e => e.hidden = true);
      if (o.name.length < 3) bad('name', 'Escribe tu nombre completo.');
      if (!/^\d{10}$/.test(o.phone.replace(/\D/g, ''))) bad('phone', 'El WhatsApp debe tener 10 dígitos.');
      if (o.delivery === 'ship') { if (!/^\d{5}$/.test(o.cp)) bad('cp', 'El código postal tiene 5 dígitos.'); if (!o.street) bad('street', 'Escribe calle y número.'); if (!o.colonia) bad('colonia', 'Escribe la colonia.'); if (!o.city) bad('city', 'Escribe la ciudad o municipio.'); }
      if (o.invoice) { if (!o.razon) bad('razon', 'Escribe la razón social.'); if (o.rfc.length < 12) bad('rfc', 'Revisa el RFC.'); }
      save();
      if (!ok) { C.toast('Revisa los campos marcados'); return; }
      const btn = $('#confirm'); btn.disabled = true; btn.textContent = 'Abriendo Mercado Pago…';
      // El pedido se registra en el sistema de Cardian; el servidor recalcula el precio con la lista oficial.
      let srv = null;
      try {
        const r = await fetch('/api/pedido', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
          lineas: lines.map(l => ({ id: l.id, color: l.tapiz || undefined, qty: l.qty })),
          cliente: { nombre: o.name, tel: o.phone }, pago: 'mp',
          envio: o.delivery === 'store' ? { tipo: 'bodega' } : { tipo: 'domicilio', estado: o.state, direccion: [o.street, o.colonia, o.cp, o.city].filter(Boolean).join(', ') },
          factura: o.invoice ? { razon: o.razon, rfc: o.rfc } : null }) });
        const j = await r.json(); if (r.ok) srv = j; else C.toast(j.error || 'No se pudo registrar el pedido');
      } catch (e) {}
      // Si el sistema no responde, el pedido sigue con un folio provisional para no frenar al cliente.
      if (!srv) srv = { folio: 'CM-' + String(Math.floor(100000 + Math.random() * 899999)), k: null, provisional: true };
      const done = { ...o, num: srv.folio, k: srv.k, mpUrl: srv.mpUrl || null, mpError: srv.mpError || null, lines: lines.map(l => ({ id: l.id, name: l.p.name, qty: l.qty, unit: l.unit, tapiz: l.tapiz ? D.TAPIZ[l.tapiz].name : '', mech: l.mech || '' })), totals: calc(), when: new Date().toISOString() };
      try { sessionStorage.setItem('cardian_done', JSON.stringify(done)); } catch (e) {}
      C.setCart([]); C.setOrder({});
      if (srv.mpUrl) { location.href = srv.mpUrl; return; }
      location.href = srv.k ? '/gracias?f=' + srv.folio + '&k=' + srv.k : '/gracias';
    };
  }
  function render() { stepper(); summary(); paso(); }
  render();
})();
</script>
</body>
</html>
