<!doctype html>
<html lang="es" data-gated>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Producto · Cardian Muebles</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/gate.js"></script>
<style>
  .product{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:40px;align-items:start;padding-block:8px 48px}
  @media (max-width:900px){.product{grid-template-columns:1fr;gap:28px}}
  .gallery{min-width:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  .gallery .main{position:relative;background:var(--surface-2);border-radius:var(--r);overflow:hidden;aspect-ratio:4/3.3}
  .gallery .main img{width:100%;height:100%;object-fit:cover;transition:opacity .25s;animation:kenburns 9s ease-in-out infinite alternate}
  .gallery .main img.swap{opacity:0}
  .gallery .main .tag{position:absolute;left:14px;top:14px;z-index:1}
  .gallery .main .progress{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold);z-index:1}
  .thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
  .thumbs button{padding:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface);aspect-ratio:4/3;opacity:.7;transition:opacity .2s,transform .2s,border-color .2s}
  .thumbs button img{width:100%;height:100%;object-fit:cover}
  .thumbs button:hover{opacity:1;transform:translateY(-2px)}
  .thumbs button[aria-pressed="true"]{opacity:1;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .buy{position:sticky;top:96px;min-width:0}
  .buy > *{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(80ms + var(--i,0)*55ms)}
  @media (max-width:900px){.buy{position:static}}
  .buy h1{font-size:clamp(28px,3.6vw,38px);margin-top:4px}
  .sku{font-size:12px;color:var(--muted);letter-spacing:.04em}
  .price-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:14px}
  .price{font-size:30px;font-weight:600;letter-spacing:-.02em}
  .price small{font-size:14px;color:var(--muted);letter-spacing:.04em;margin-left:4px;font-weight:400}
  .price .from{font-size:14px;color:var(--muted);font-weight:400;margin-right:6px}
  .was{color:var(--muted);text-decoration:line-through}
  .msi{font-size:13px;color:var(--muted);margin-top:2px}
  .msi b{color:var(--fg);font-weight:500}
  .mp{display:inline-block;background:#009ee3;color:#fff;font-size:10px;font-weight:600;letter-spacing:.04em;padding:2px 6px;border-radius:3px;vertical-align:1px}
  .opt{margin-top:22px}
  .delivery{margin-top:26px;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
  .seg{display:grid;grid-template-columns:1fr 1fr}
  .seg button{border:0;background:var(--surface-2);padding:12px 10px;font-size:13px;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);transition:background .2s,color .2s}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:500;border-bottom-color:transparent;box-shadow:inset 0 2px 0 var(--gold)}
  .delivery .body{padding:16px}
  .ship-result{margin-top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:14px}
  .ship-result .cost{font-weight:600;white-space:nowrap}
  .ship-result .cost.free{color:var(--ok)}
  .ship-result small{display:block;color:var(--muted);font-size:12px}
  .volume{margin-top:10px;font-size:12.5px;color:var(--muted)}
  .volume a{color:var(--gold-deep)}
  .cta{display:grid;gap:10px;margin-top:22px}
  #buyNow{animation:glowGold 2.8s ease-out infinite}
  .assure{margin-top:20px}
  .fits{margin-top:22px;border:1px solid var(--line);border-radius:6px;padding:16px;background:var(--surface)}
  .fits h3{font-size:15px;margin-bottom:6px}
  .fits .row{display:flex;gap:10px;align-items:center;margin-top:10px}
  .fits input{width:120px}
  .fits .res{font-size:13.5px;margin-top:10px}
  .fits .res.ok{color:var(--ok)}.fits .res.bad{color:#b43b3b}
  .specs{border-top:1px solid var(--line);padding-block:40px}
  .specs .cols{display:grid;grid-template-columns:1.2fr 1fr;gap:40px}
  @media (max-width:820px){.specs .cols{grid-template-columns:1fr}}
  .specs h2{font-size:24px;margin-bottom:14px}
  .specs p{max-width:62ch;margin:0 0 12px}
  table.measures{width:100%;border-collapse:collapse;font-size:14px}
  table.measures td{padding:9px 0;border-bottom:1px solid var(--line)}
  table.measures td:last-child{text-align:right;font-weight:500}
  .incl{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
  .incl ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted);display:grid;gap:4px}
  .incl h4{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep);font-weight:500}
  @media (max-width:600px){.incl{grid-template-columns:1fr}}
  .related{border-top:1px solid var(--line);padding-block:40px 20px}
  .sticky-bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--ink-fg);z-index:45;display:none;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -10px 30px -12px rgba(0,0,0,.6)}
  .sticky-bar .p{font-weight:600;font-size:17px}
  .sticky-bar .p small{display:block;font-size:11px;color:var(--ink-muted);font-weight:400}
  @media (max-width:900px){.sticky-bar{display:flex}body{padding-bottom:70px}.wa-float{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
  .medida-box{margin-top:22px;background:var(--gold-soft);border-radius:6px;padding:16px;font-size:13.5px}
  .medida-box b{display:block;font-weight:600;margin-bottom:4px}
</style>
</head>
<body>
<div id="site-header"></div>

<main class="wrap">
  <nav class="crumbs" aria-label="Ruta" id="crumbs"></nav>
  <section class="product" id="product"></section>

  <section class="specs" id="specs"></section>

  <section class="related">
    <div class="section-head"><div><div class="eyebrow">También te puede interesar</div><h2 style="font-size:24px">Otras piezas de la misma familia</h2></div><a class="more" id="moreLink" href="/catalogo">Ver todo →</a></div>
    <div class="cards" id="related"></div>
  </section>
</main>

<div class="sticky-bar" id="stickyBar"></div>
<div id="site-footer"></div>
<script src="/assets/data.js"></script>
<script src="/assets/site.js"></script>
<script>
(function(){
  const C = window.Cardian, D = window.CARDIAN, { $, $$, fmt, fmt2 } = C;
  const id = new URLSearchParams(location.search).get('id') || (location.pathname.match(/\/producto\/([^/]+)/) || [])[1];
  const p = C.byId(id) || D.products[0];
  const cat = C.catOf(p.cat);
  document.title = p.name + ' · Cardian Muebles';
  $('#crumbs').innerHTML = `<a href="/inicio">Inicio</a><span>/</span><a href="/${cat.id}">${cat.name}</a><span>/</span>${p.name}`;
  $('#moreLink').href = '/' + cat.id;

  const st = { tapiz: (p.tapiz || [])[0] || null, mech: (p.mech || [{ name: null }])[0].name, qty: 1, delivery: 'ship', state: 'Ciudad de México' };
  const isMedida = p.stock === 'medida';

  // ----- render estático -----
  const thumbs = p.imgs.map((src, i) => `<button type="button" aria-pressed="${i === 0}" data-i="${i}"><img src="/${src}" alt="Vista ${i + 1}"></button>`).join('');
  const tapizChips = p.tapiz ? `<div class="opt field"><div class="lbl"><span>Tapiz</span><b id="tapizName"></b></div><div class="chips" id="tapiz">${p.tapiz.map(t => `<button type="button" class="chip" data-t="${t}"><span class="sw" style="background:${D.TAPIZ[t].hex}"></span>${D.TAPIZ[t].name}${p.extras && p.extras[t] ? `<span class="plus">+ ${fmt(p.extras[t])}</span>` : ''}</button>`).join('')}</div></div>` : '';
  const mechChips = p.mech ? `<div class="opt field"><div class="lbl"><span>Mecanismo reclinable</span><b id="mechName"></b></div><div class="chips" id="mech">${p.mech.map(m => `<button type="button" class="chip" data-m="${m.name}">${m.name}<span class="plus">${m.extra ? '+ ' + fmt(m.extra) : 'incluido'}</span></button>`).join('')}</div></div>` : '';
  const stateOpts = D.states.map(s => `<option value="${s}">${s}</option>`).join('');

  $('#product').innerHTML = `
    <figure class="gallery" style="margin:0">
      <div class="main"><span class="tag ${C.stockClass(p)}">${C.stockLabel(p)}</span><img id="mainImg" src="/${p.imgs[0]}" alt="${p.name}"><div class="progress" id="progress"></div></div>
      ${p.imgs.length > 1 ? `<div class="thumbs" id="thumbs">${thumbs}</div>` : ''}
    </figure>
    <div class="buy">
      <div class="eyebrow">${cat.name} · ${p.type}</div>
      <h1>${p.name}</h1>
      <div class="sku">SKU CM-${p.id.toUpperCase().replace(/-/g, '')} · ${p.stock === 'inmediata' ? 'Entrega en 3 a 5 días hábiles en CDMX y EdoMex' : p.stock === 'medida' ? 'Cotización con tus medidas en 24 horas' : 'Se fabrica en ' + p.dias + ' días hábiles'}</div>
      <div class="price-row"><div class="price num">${p.from ? '<span class="from">desde</span>' : ''}<span id="priceMain">${fmt(p.price)}</span><small>MXN</small></div>${p.oldPrice ? `<div class="was num">${fmt(p.oldPrice)}</div>` : ''}</div>
      <div class="msi num">${isMedida ? 'Precio de referencia. El precio cerrado sale de tus medidas.' : 'o <b id="msiLine">12 × ' + fmt2(p.price / 12) + '</b> sin intereses con <span class="mp">mercado pago</span>'}</div>
      <p class="muted" style="margin-top:14px;font-size:14px">${p.short}</p>
      ${tapizChips}${mechChips}
      ${isMedida ? `<div class="medida-box"><b>Este mueble se fabrica a tu medida</b>Mándanos las medidas de tu espacio o un plano y te cotizamos en 24 horas sin compromiso. En CDMX y Estado de México la medición a domicilio no tiene costo.</div>` : `
      <div class="opt field"><div class="lbl"><span>Cantidad</span></div><div class="qty"><button type="button" id="qMinus" aria-label="Menos">−</button><output id="qty">1</output><button type="button" id="qPlus" aria-label="Más">+</button></div><div class="volume" id="volume">¿Necesitas 10 o más? <a href="/proyectos?modelo=${p.id}">Cotiza por volumen →</a></div></div>
      <div class="delivery">
        <div class="seg" role="group" aria-label="Forma de entrega"><button type="button" id="segShip" aria-pressed="true">Envío a domicilio</button><button type="button" id="segStore" aria-pressed="false">Recoger en bodega</button></div>
        <div class="body" id="shipBody"><div class="field"><label for="state">Calcular envío por estado</label><select id="state" class="input">${stateOpts}</select></div>
          <div class="ship-result"><div><span id="shipZone"></span><small id="shipDays"></small></div><div class="cost num" id="shipCost"></div></div>
          <div class="note" style="margin-top:10px">Tarifa por zona y tamaño del mueble (${p.bultos} bulto${p.bultos > 1 ? 's' : ''}, factor ${p.factor}). Incluye maniobra hasta planta baja, armado y retiro del empaque. <a href="/envios" style="color:var(--gold-deep)">Cómo calculamos el envío</a></div></div>
        <div class="body" id="storeBody" hidden><b style="font-weight:500">Recoger en bodega, sin costo de envío</b><br><span style="font-size:14px">Te confirmamos por WhatsApp el punto de entrega, el horario y la fecha para recogerlo.</span><div class="note" style="margin-top:8px">Necesitas vehículo con espacio para ${p.bultos} bulto${p.bultos > 1 ? 's' : ''}. Si prefieres, te lo llevamos armado a tu casa.</div></div>
      </div>`}
      <div class="cta">
        ${isMedida ? `<a class="btn gold" id="quoteBtn" href="#" target="_blank" rel="noopener">${C.WA_SVG} Cotizar por WhatsApp</a><a class="btn ghost" href="/proyectos?modelo=${p.id}">Enviar medidas por formulario</a>` : `<button type="button" class="btn primary" id="buyNow">Comprar ahora</button><button type="button" class="btn ghost" id="addCart">Agregar al carrito</button>`}
      </div>
      <div class="assure"><div><b>Garantía 1 año</b>estructura y mecanismo</div><div><b>Armado incluido</b>en entregas a domicilio</div><div><b>Factura</b>CFDI 4.0 al momento</div><div><b>Pago seguro</b>Mercado Pago o SPEI</div></div>
      ${p.dims ? `<div class="fits"><h3>¿Te cabe? Revisa antes de pagar</h3><p class="note">Este mueble ocupa ${p.dims.largo} cm de largo y ${p.dims.fondo} cm de fondo. Escribe el largo de tu pared.</p><div class="row"><input class="input" id="wall" type="number" inputmode="numeric" placeholder="cm" min="50" max="2000"><button type="button" class="btn sm ghost" id="fitBtn">Revisar</button></div><div class="res" id="fitRes"></div></div>` : ''}
    </div>`;

  $('#specs').innerHTML = `<div class="cols"><div><h2>${isMedida ? 'Cómo se cotiza y se fabrica' : 'Diseño y materiales'}</h2><p>${p.desc}</p>${isMedida ? '<p>1. Nos mandas medidas, fotos o plano. 2. Te enviamos propuesta con precio cerrado. 3. Con el 50 % de anticipo entra a producción. 4. Instalamos y revisamos contigo cada puerta y cajón.</p>' : ''}
    <div class="incl"><div><h4>Qué incluye</h4><ul><li>${p.bultos > 1 ? 'Pieza en ' + p.bultos + ' bultos' : 'Pieza en 1 bulto'}, emplayada con esquineros</li><li>Entrega hasta planta baja y armado en tu domicilio</li><li>Retiro del empaque</li><li>Garantía por escrito de 1 año</li></ul></div><div><h4>No incluye</h4><ul><li>Subida a pisos sin elevador (se cotiza antes)</li><li>Retiro de tu mueble anterior</li><li>Accesorios decorativos de las fotos</li></ul></div></div></div>
    <div><h2>Medidas</h2><table class="measures num">${(p.specs || []).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>
    <p class="note" style="margin-top:14px">Cuidado: limpia el tapiz con paño húmedo y jabón neutro; no uses cloro ni solventes. Las cubiertas de piedra se limpian con agua y jabón.</p></div></div>`;

  $('#related').innerHTML = D.products.filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 4).map(C.card).join('');
  if (!isMedida) $('#stickyBar').innerHTML = `<div class="p num"><span id="stickyPrice">${fmt(p.price)}</span><small id="stickyMsi">12 × ${fmt2(p.price / 12)} sin intereses</small></div><button type="button" class="btn gold sm" id="buyNow2">Comprar ahora</button>`;
  else $('#stickyBar').innerHTML = `<div class="p"><span>Desde ${fmt(p.price)}</span><small>Se cotiza con tus medidas</small></div><a class="btn gold sm" id="quoteBtn2" href="#" target="_blank" rel="noopener">Cotizar</a>`;

  // ----- galería -----
  const thumbBtns = $$('#thumbs button'); let cur = 0, timer = null;
  function show(i) { cur = i; thumbBtns.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i))); const img = $('#mainImg'); const apply = () => { img.src = '/' + p.imgs[i]; img.classList.remove('swap'); }; if (C.reduceMotion) apply(); else { img.classList.add('swap'); setTimeout(apply, 240); } restart(); }
  function restart() { clearInterval(timer); const pr = $('#progress'); pr.style.transition = 'none'; pr.style.width = '0'; void pr.offsetWidth; if (thumbBtns.length > 1 && !C.reduceMotion) { pr.style.transition = 'width 5000ms linear'; pr.style.width = '100%'; timer = setInterval(() => show((cur + 1) % thumbBtns.length), 5000); } }
  thumbBtns.forEach(b => b.addEventListener('click', () => show(+b.dataset.i)));
  $('.gallery .main').addEventListener('mouseenter', () => clearInterval(timer));
  $('.gallery .main').addEventListener('mouseleave', restart);
  restart();

  // ----- opciones y precio -----
  function animateMoney(el, to) { const from = +(el.dataset.v || to); el.dataset.v = to; if (C.reduceMotion || from === to) { el.textContent = fmt(to); return; } const t0 = performance.now(); (function step(now) { const k = Math.min(1, (now - t0) / 450), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); })(t0); }
  function render() {
    const unit = C.unitPrice(p, st);
    animateMoney($('#priceMain'), unit);
    if ($('#msiLine')) $('#msiLine').textContent = '12 × ' + fmt2(unit / 12);
    if ($('#stickyPrice')) { $('#stickyPrice').textContent = fmt(unit); $('#stickyMsi').textContent = '12 × ' + fmt2(unit / 12) + ' sin intereses'; }
    if ($('#tapiz')) { $$('#tapiz .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === st.tapiz))); $('#tapizName').textContent = D.TAPIZ[st.tapiz].name; }
    if ($('#mech')) { $$('#mech .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === st.mech))); $('#mechName').textContent = st.mech; }
    if ($('#qty')) {
      $('#qty').textContent = st.qty;
      $('#volume').innerHTML = st.qty >= 10 ? `Para 10 piezas o más tenemos precio por volumen. <a href="/proyectos?modelo=${p.id}&cantidad=${st.qty}">Cotizar ${st.qty} piezas →</a>` : `¿Necesitas 10 o más? <a href="/proyectos?modelo=${p.id}">Cotiza por volumen →</a>`;
      $('#segShip').setAttribute('aria-pressed', String(st.delivery === 'ship')); $('#segStore').setAttribute('aria-pressed', String(st.delivery === 'store'));
      $('#shipBody').hidden = st.delivery !== 'ship'; $('#storeBody').hidden = st.delivery !== 'store';
      const s = C.shipping(st.state, [{ factor: p.factor, qty: st.qty }]);
      $('#shipZone').textContent = s.zone.name + ' · ' + st.state; $('#shipDays').textContent = 'Entrega estimada: ' + s.zone.days + (p.stock === 'pedido' ? ' + ' + p.dias + ' de fabricación' : '');
      const sc = $('#shipCost'); sc.textContent = s.cost === 0 ? 'Gratis' : fmt(s.cost); sc.classList.toggle('free', s.cost === 0);
    }
    const waText = `Hola, me interesa ${p.name}${st.tapiz ? ' en ' + D.TAPIZ[st.tapiz].name.toLowerCase() : ''} (${fmt(unit)}). ${isMedida ? 'Quiero cotizarla con mis medidas.' : 'Quiero preguntar sobre'} `;
    const wf = $('#waFloat'); if (wf) wf.href = C.wa(waText);
    $$('#quoteBtn, #quoteBtn2').forEach(a => a.href = C.wa(waText));
  }
  $$('#tapiz .chip').forEach(b => b.addEventListener('click', () => { st.tapiz = b.dataset.t; const i = p.imgs.findIndex((s, k) => k === p.tapiz.indexOf(st.tapiz)); if (i >= 0 && i < p.imgs.length && thumbBtns.length) show(i); render(); }));
  $$('#mech .chip').forEach(b => b.addEventListener('click', () => { st.mech = b.dataset.m; render(); }));
  if ($('#qty')) {
    $('#qMinus').onclick = () => { st.qty = Math.max(1, st.qty - 1); render(); };
    $('#qPlus').onclick = () => { st.qty = Math.min(20, st.qty + 1); render(); };
    $('#segShip').onclick = () => { st.delivery = 'ship'; render(); };
    $('#segStore').onclick = () => { st.delivery = 'store'; render(); };
    $('#state').value = st.state; $('#state').onchange = e => { st.state = e.target.value; render(); };
    const add = () => { C.addToCart(p.id, { tapiz: st.tapiz, mech: st.mech }, st.qty); C.toast(st.qty + ' × ' + p.name + ' en tu carrito'); };
    $('#addCart').onclick = () => { add(); $('#addCart').textContent = 'Agregado al carrito'; setTimeout(() => $('#addCart').textContent = 'Agregar al carrito', 1600); };
    const buy = () => { add(); C.setOrder({ delivery: st.delivery, state: st.state }); location.href = '/checkout'; };
    $('#buyNow').onclick = buy; if ($('#buyNow2')) $('#buyNow2').onclick = buy;
  }
  if ($('#fitBtn')) $('#fitBtn').onclick = () => { const w = +$('#wall').value; const r = $('#fitRes'); if (!w) { r.textContent = 'Escribe el largo de tu pared en centímetros.'; r.className = 'res'; return; } const need = p.dims.largo + 10; if (w >= need) { r.textContent = `Cabe con ${w - need} cm de sobra (dejamos 5 cm de cada lado).`; r.className = 'res ok'; } else { r.textContent = `Te faltan ${need - w} cm. Mira un modelo más corto o pídelo a medida por WhatsApp.`; r.className = 'res bad'; } };
  render();
  $$('.buy > *').forEach((el, i) => el.style.setProperty('--i', i));
  C.reveal();
})();
</script>
</body>
</html>
