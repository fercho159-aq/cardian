<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedido recibido · Cardian Muebles</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .ty{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.8fr);gap:32px;align-items:start;padding-block:36px 48px}
  @media (max-width:860px){.ty{grid-template-columns:1fr}}
  .ok-badge{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin-bottom:16px;animation:pop .6s both}
  .ok-badge svg{width:30px;height:30px}
  h1{font-size:clamp(26px,3.5vw,36px)}
  .num-box{display:inline-block;margin-top:10px;background:var(--ink);color:var(--gold-bright);padding:8px 16px;border-radius:4px;font-weight:600;letter-spacing:.08em}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:22px;animation:rise .5s .15s both}
  .panel h2{font-size:18px;margin-bottom:10px}
  .panel dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:12px 0 0;font-size:14px}
  .panel dt{color:var(--muted)}.panel dd{margin:0;font-weight:500}
  .panel ol{margin:10px 0 0;padding-left:18px;font-size:14px}.panel li{margin-bottom:6px}
  .mpbtn{display:block;width:100%;background:#009ee3;color:#fff;border:0;border-radius:6px;padding:14px;font-weight:600;letter-spacing:.04em;margin-top:14px;font-size:14px;text-align:center;text-decoration:none}
  .copy{display:inline-flex;align-items:center;gap:8px;font-family:Consolas,monospace;background:var(--surface-2);padding:8px 12px;border-radius:4px;font-size:14px}
  .copy button{border:0;background:var(--ink);color:var(--ink-fg);border-radius:3px;padding:3px 9px;font-size:11px}
  .timeline{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:0}
  .timeline li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:0 0 18px;position:relative;font-size:14px}
  .timeline li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:4px;position:relative;z-index:1;justify-self:center}
  .timeline li::after{content:"";position:absolute;left:10px;top:18px;bottom:-2px;width:2px;background:var(--line)}
  .timeline li:last-child::after{display:none}
  .timeline li.on::before{border-color:var(--gold);background:var(--gold)}
  .timeline li b{display:block;font-weight:500}.timeline li span{color:var(--muted);font-size:12.5px}
  .summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
  .summary .it{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .summary .row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
  .summary .total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:18px;font-weight:600}
  .demo{margin-top:16px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="wrap"><div class="ty" id="ty"></div></main>
<div id="site-footer"></div>
<script src="/assets/data.js"></script>
<script src="/assets/site.js"></script>
<script>
(async function(){
  const C = window.Cardian, { $, fmt, fmt2 } = C;
  const qs = new URLSearchParams(location.search); const F = qs.get('f'), K = qs.get('k');
  let d = null; try { d = JSON.parse(sessionStorage.getItem('cardian_done') || 'null'); } catch (e) {}
  if (F && K) {
    // Datos reales del pedido desde el sistema (sirve aunque se abra en otro dispositivo o al volver de Mercado Pago)
    let tk = null; try { const r = await fetch('/api/ticket?f=' + F + '&k=' + K); if (r.ok) tk = await r.json(); } catch (e) {}
    if (tk) { const v = tk.venta; d = { ...(d && d.num === F ? d : {}), num: v.folio, k: K, name: v.cliente.nombre, phone: v.cliente.tel, email: v.cliente.email, pay: v.pagoElegido || (d && d.pay) || 'mp', delivery: v.envio.tipo === 'domicilio' ? 'ship' : 'store', city: v.envio.direccion || '', state: v.envio.estado || '', invoice: !!v.factura, razon: v.factura ? v.factura.razon : '',
      lines: v.lineas.map(l => ({ id: l.id, name: l.nombre, qty: l.qty, unit: l.unit, tapiz: l.colorNombre || '' })), totals: { sub: v.sub, ship: { cost: v.costoEnvio }, disc: v.descuento, total: v.total, iva: v.iva || 0 }, pagado: v.pagado, saldo: v.saldo, estado: v.estado }; }
    if (qs.get('mp') === 'ok' && d) { try { const r = await fetch('/api/mp?f=' + F + '&k=' + K + (qs.get('payment_id') ? '&payment_id=' + qs.get('payment_id') : '')); if (r.ok) { const j = await r.json(); if (j.estado) { d.estado = j.estado; d.pagado = j.pagado; d.saldo = Math.max(0, j.total - j.pagado); } } } catch (e) {} }
  }
  if (!d) { $('#ty').innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px"><h1>No hay un pedido reciente</h1><p class="muted" style="margin:10px 0 20px">Si ya compraste, revisa tu WhatsApp o correo para ver la confirmación.</p><a class="btn gold" href="/catalogo">Ver el catálogo</a></div>`; return; }
  const t = d.totals; const wa = C.wa(`Hola, acabo de hacer el pedido ${d.num} y ${d.pay === 'spei' ? 'te envío mi comprobante de transferencia' : d.pay === 'cash' ? 'quiero confirmar mi anticipo' : 'tengo una duda'}.`);
  let pay = '';
  if (d.pay === 'mp') pay = `<div class="panel"><h2>${d.estado === 'pagado' ? 'Pago recibido, gracias' : 'Completa tu pago con Mercado Pago'}</h2><p class="muted" style="font-size:14px">${d.estado === 'pagado' ? 'Tu pago quedó registrado. Tu pedido entra a producción y te confirmamos la fecha de entrega por WhatsApp.' : 'Si no terminaste el pago, puedes completarlo aquí. En cuanto se acredite, tu pedido entra a producción y te confirmamos por WhatsApp.'}</p><dl><dt>Total</dt><dd class="num">${fmt(t.total)}</dd><dt>Referencia</dt><dd>${d.num}</dd></dl>${d.estado === 'pagado' ? '' : '<a class="mpbtn" href="#" id="mpGo">Pagar con Mercado Pago</a>'}</div>`;
  $('#ty').innerHTML = `<section>
      <div class="ok-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg></div>
      <h1>Recibimos tu pedido, ${d.name.split(' ')[0]}</h1>
      <p class="muted" style="margin-top:8px">Te confirmamos por WhatsApp al ${d.phone}${d.email ? ' y al correo ' + d.email : ''}. Guarda tu número de pedido.</p>
      <div class="num-box">${d.num}</div>
      ${pay}
      <div class="panel"><h2>Qué sigue</h2><ol class="timeline">
        <li class="on"><div><b>Pedido recibido</b><span>Hoy. ${d.pay === 'mp' ? 'Se confirma al aprobarse el pago.' : d.pay === 'spei' ? 'Se confirma al acreditarse la transferencia.' : 'Se confirma al registrarse el anticipo.'}</span></div></li>
        <li><div><b>En producción</b><span>${d.lines.every(l => (C.byId(l.id) || {}).stock === 'inmediata') ? 'Tus piezas ya están terminadas: pasan directo a empaque.' : 'Te mandamos fotos del avance por WhatsApp.'}</span></div></li>
        <li><div><b>Salió de la fábrica</b><span>Te confirmamos la ventana de entrega con 2 días de anticipación.</span></div></li>
        <li><div><b>${d.delivery === 'store' ? 'Listo para recoger' : 'En camino'}</b><span>${d.delivery === 'store' ? 'Te confirmamos punto de entrega, horario y fecha por WhatsApp.' : 'El chofer te avisa cuando va en camino. Lo armamos y nos llevamos el empaque.'}</span></div></li>
        <li><div><b>Entregado</b><span>Revisas pieza por pieza, firmas de conformidad y te dejamos la garantía por escrito.</span></div></li>
      </ol></div>
    </section>
    <aside class="summary"><h2 style="font-size:17px;margin-bottom:8px">Resumen</h2>${d.lines.map(l => `<div class="it"><span>${l.qty} × ${l.name}${l.tapiz ? ' · ' + l.tapiz : ''}</span><span class="num">${fmt(l.unit * l.qty)}</span></div>`).join('')}
      <div class="row" style="margin-top:8px"><span>Subtotal</span><span class="num">${fmt(t.sub)}</span></div><div class="row"><span>Envío</span><span class="num">${t.ship.cost ? fmt(t.ship.cost) : 'Gratis'}</span></div>${t.disc ? `<div class="row" style="color:var(--ok)"><span>Descuento SPEI</span><span class="num">−${fmt(t.disc)}</span></div>` : ''}${t.iva ? `<div class="row"><span>IVA 16 % (factura)</span><span class="num">${fmt(t.iva)}</span></div>` : ''}<div class="row total"><span>Total</span><span class="num">${fmt(t.total)}</span></div>
      <div class="note" style="margin-top:12px">${d.delivery === 'store' ? 'Recoger en bodega' : 'Entrega en ' + d.city + ', ' + d.state}${d.invoice ? ' · Factura CFDI a ' + d.razon : ''}</div>
      <div style="display:grid;gap:8px;margin-top:16px"><a class="btn ghost sm block" href="/catalogo">Seguir comprando</a><a class="btn ghost sm block" href="/envios">Ver cómo es la entrega</a></div></aside>`;
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => { navigator.clipboard.writeText(b.dataset.copy).then(() => C.toast('Copiado')).catch(() => C.toast('Selecciona y copia el texto')); });
  const mp = $('#mpGo'); if (mp) mp.onclick = e => { e.preventDefault(); if (d.mpUrl) { location.href = d.mpUrl; return; } C.toast(d.mpError || 'El pago en línea aún no está activo. Te mandamos el enlace de pago por WhatsApp.'); };
  // Ticket real y estado del pago
  if (d.k) { const box = $('.num-box'); if (box) box.insertAdjacentHTML('afterend', '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0 4px"><a class="btn ghost sm" href="/ticket?f=' + d.num + '&k=' + d.k + '">Ver mi ticket</a>' + (d.estado === 'pagado' ? '<span class="tag ok" style="padding:10px 14px">Pago recibido, gracias</span>' : d.estado === 'apartado' ? '<span class="tag medida" style="padding:10px 14px">Abono recibido · saldo ' + fmt(d.saldo) + '</span>' : '') + '</div>'); }
})();
</script>
</body>
</html>
