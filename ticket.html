<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ticket · Cardian Muebles</title>
<link rel="icon" href="/img/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
  :root{--ink:#0d0c0a;--gold:#b08a35;--gold-deep:#7f6020;--muted:#6f685c;--line:#dcd5c8;--ok:#2e7d4f;--warn:#9a6b00;--bg:#f6f3ee}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:"Poppins","Segoe UI",sans-serif;color:#17140f;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{max-width:420px;margin:24px auto;padding:0 14px}
  .ticket{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.12);overflow:hidden}
  .head{background:var(--ink);color:#f3eadb;padding:22px 22px 18px;text-align:center}
  .head img{height:58px;display:block;margin:0 auto 8px}
  .head small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#a79d8a}
  .body{padding:18px 22px 22px;font-size:13.5px}
  .folio{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .folio b{font-size:20px;letter-spacing:.04em}
  .folio span{color:var(--muted);font-size:12px;text-align:right}
  .estado{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .estado.pagado{background:#e1f1e7;color:var(--ok)}
  .estado.apartado{background:#f3e9cf;color:var(--gold-deep)}
  .estado.pendiente{background:#fff3d6;color:var(--warn)}
  .estado.cancelado{background:#f8e1df;color:#b4322b}
  .estado.entregado,.estado.en-produccion{background:var(--ink);color:#f3eadb}
  .sec{border-top:1px dashed var(--line);padding:12px 0}
  .sec h3{margin:0 0 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .row{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
  .row small{display:block;color:var(--muted);font-size:12px}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .tot .row.t{font-weight:600;font-size:17px;border-top:1px solid var(--ink);margin-top:6px;padding-top:8px}
  .saldo{background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
  .saldo b{font-size:16px}
  .foot{text-align:center;color:var(--muted);font-size:12px;padding:14px 22px 20px;border-top:1px dashed var(--line);line-height:1.5}
  .acts{display:flex;gap:10px;justify-content:center;margin:16px 0 30px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);border-radius:999px;padding:11px 20px;font-size:13px;font-weight:500;text-decoration:none;color:var(--ink);background:#fff;cursor:pointer;font-family:inherit}
  .btn.wa{background:#25d366;border-color:#25d366;color:#fff}
  .btn.ink{background:var(--ink);color:#f3eadb}
  .err{text-align:center;padding:60px 20px;color:var(--muted)}
  @media print{body{background:#fff}.wrap{max-width:none;margin:0;padding:0}.ticket{box-shadow:none;border-radius:0}.acts{display:none}}
</style>
</head>
<body>
<div class="wrap" id="t"><div class="err">Cargando ticket…</div></div>
<script>
(async function(){
  const q = new URLSearchParams(location.search); const f = q.get('f'), k = q.get('k');
  const el = document.getElementById('t');
  const fmt = n => '$' + Math.round(n || 0).toLocaleString('es-MX');
  const fecha = s => new Date(s).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' });
  if (!f) { el.innerHTML = '<div class="err">Falta el número de pedido.</div>'; return; }
  const r = await fetch('/api/ticket?f=' + encodeURIComponent(f) + (k ? '&k=' + encodeURIComponent(k) : '')); const j = await r.json();
  if (!r.ok) { el.innerHTML = '<div class="err">' + (j.error || 'No se pudo abrir el ticket') + '</div>'; return; }
  const v = j.venta, aj = j.ajustes;
  const estadoTxt = { pendiente: 'Pendiente de pago', apartado: 'Apartado · con abono', pagado: 'Pagado', 'en-produccion': 'En producción', entregado: 'Entregado', cancelado: 'Cancelado' }[v.estado] || v.estado;
  const pagos = (v.pagos || []).map(p => `<div class="row"><span>${fecha(p.cuando)}<small>${p.metodo}${p.ref ? ' · ' + p.ref : ''}</small></span><span class="num">${fmt(p.monto)}</span></div>`).join('') || '<div class="row"><span style="color:var(--muted)">Sin pagos registrados</span></div>';
  const enlace = location.origin + '/ticket?f=' + v.folio + '&k=' + j.k;
  const waTxt = `Hola ${v.cliente.nombre.split(' ')[0]}, te comparto tu ticket ${v.folio} de ${aj.negocio}: total ${fmt(v.total)}, ${v.saldo > 0 ? 'pagado ' + fmt(v.pagado) + ', saldo ' + fmt(v.saldo) : 'pagado completo'}. Lo puedes ver aquí: ${enlace}`;
  el.innerHTML = `
  <div class="ticket">
    <div class="head"><img src="/img/logo.png" alt="${aj.negocio}"><small>Ticket de compra</small></div>
    <div class="body">
      <div class="folio"><b>${v.folio}</b><span>${fecha(v.creado)}<br>${v.sucursal ? 'Sucursal ' + v.sucursal : v.origen === 'sitio' ? 'Compra en línea' : ''}</span></div>
      <span class="estado ${v.estado}">${estadoTxt}</span>
      <div class="sec"><h3>Cliente</h3><div>${v.cliente.nombre}</div><small style="color:var(--muted)">${v.cliente.tel ? 'WhatsApp ' + v.cliente.tel : ''}${v.cliente.email ? ' · ' + v.cliente.email : ''}</small>
        ${v.envio && v.envio.tipo === 'domicilio' ? `<div style="margin-top:6px;font-size:12.5px"><b>Entrega:</b> ${v.envio.direccion || ''} ${v.envio.estado ? '· ' + v.envio.estado : ''}</div>` : '<div style="margin-top:6px;font-size:12.5px"><b>Entrega:</b> recoger en bodega (se confirma por WhatsApp)</div>'}</div>
      <div class="sec"><h3>Artículos</h3>${v.lineas.map(l => `<div class="row"><span>${l.qty} × ${l.nombre}${l.colorNombre ? '<small>Color ' + l.colorNombre + '</small>' : ''}</span><span class="num">${fmt(l.unit * l.qty)}</span></div>`).join('')}</div>
      <div class="sec tot"><div class="row"><span>Subtotal</span><span class="num">${fmt(v.sub)}</span></div><div class="row"><span>Envío y armado</span><span class="num">${v.costoEnvio ? fmt(v.costoEnvio) : 'Gratis'}</span></div>${v.descuento ? `<div class="row"><span>Descuento</span><span class="num">−${fmt(v.descuento)}</span></div>` : ''}<div class="row t"><span>Total</span><span class="num">${fmt(v.total)}</span></div></div>
      <div class="sec"><h3>Pagos</h3>${pagos}<div class="saldo"><span>${v.saldo > 0 ? 'Saldo por pagar' : 'Pagado completo'}</span><b class="num">${v.saldo > 0 ? fmt(v.saldo) : fmt(v.pagado)}</b></div></div>
      ${v.factura ? `<div class="sec"><h3>Factura</h3>${v.factura.razon} · ${v.factura.rfc}</div>` : ''}
      ${j.vendedor ? `<div class="sec"><h3>Te atiende</h3>${j.vendedor.nombre}${j.vendedor.whatsapp ? ' · WhatsApp ' + j.vendedor.whatsapp : ''}</div>` : ''}
    </div>
    <div class="foot">${aj.leyendaTicket || 'Garantía de 1 año en estructura y mecanismos. Conserva este ticket para cualquier aclaración.'}<br>${aj.negocio} · 55 7006 0233 · atencion@cardianmuebles.com</div>
  </div>
  <div class="acts">
    <button class="btn ink" onclick="print()">Imprimir o guardar PDF</button>
    ${v.cliente.tel ? `<a class="btn wa" href="https://wa.me/52${v.cliente.tel}?text=${encodeURIComponent(waTxt)}" target="_blank" rel="noopener">Enviar por WhatsApp</a>` : ''}
    <button class="btn" id="cp">Copiar enlace</button>
  </div>`;
  document.getElementById('cp').onclick = () => navigator.clipboard.writeText(enlace).then(() => { document.getElementById('cp').textContent = 'Enlace copiado'; });
})();
</script>
</body>
</html>
